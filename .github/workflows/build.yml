name: Build sitemaps

# WEER WAKKER sinds 17-08-2026, met een nieuwe hoofdtaak: korte deel-links op
# eigen domein (s/<code> → artikel met UTM-parameters) voor de WhatsApp-promotie
# van de nieuws-bot. Openbare verkorters worden door WhatsApp sneller als spam
# gezien; het eigen subdomein niet. De sitemaps draaien als bijvangst gewoon mee
# (de site serveert zelf ook verse sitemaps sinds 07-08; dubbel schaadt niet).
on:
  workflow_dispatch:
  schedule:
    - cron: "20 * * * *"

permissions:
  contents: write

concurrency:
  group: sitemaps
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: node generate.js

      - name: Commit bijgewerkte sitemap
        run: |
          git config user.name "sitemap-bot"
          git config user.email "bot@users.noreply.github.com"
          # Alle drie de uitvoerbestanden. Stond hier eerder alleen news-sitemap.xml
          # en index.html; toen sitemap.xml erbij kwam bleef die ongestaged en brak
          # `git pull --rebase` met "cannot pull with rebase: You have unstaged
          # changes". Gevolg: zeven dagen lang geen enkele push, terwijl de runs
          # zelf gewoon leken te draaien.
          # -A ook over s/ zodat verwijderde korte links als deletie meegaan.
          git add -A news-sitemap.xml sitemap.xml index.html s
          git diff --staged --quiet || git commit -m "sitemap verversen [skip ci]"
          # Autostash zodat een onverwacht extra uitvoerbestand de rebase niet
          # opnieuw kan blokkeren.
          git pull --rebase --autostash origin main
          git push
