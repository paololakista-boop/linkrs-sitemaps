name: Build sitemaps

# SLAPEND sinds 07-08-2026. De site serveert nu zelf verse sitemaps op
# linkrsmarokko.com/sitemap.xml en /news-sitemap.xml, beide opgenomen in
# robots.txt en zonder fouten opgehaald door Search Console. Deze repo was de
# noodoplossing voor de periode waarin de sitemap van de site stilstond op
# 25-06-2026; die reden is vervallen.
#
# Twee sitemaps met dezelfde URL's naast elkaar draaien voegt niets toe, dus de
# uurlijkse cron staat uit. Handmatig starten kan nog, en het DNS-record plus
# GitHub Pages blijven staan zodat dit binnen een minuut weer aan kan als de
# sitemap van de site ooit opnieuw stilvalt.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sitemaps
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: node generate.js

      - name: Commit bijgewerkte sitemap
        run: |
          git config user.name "sitemap-bot"
          git config user.email "bot@users.noreply.github.com"
          # Alle drie de uitvoerbestanden. Stond hier eerder alleen news-sitemap.xml
          # en index.html; toen sitemap.xml erbij kwam bleef die ongestaged en brak
          # `git pull --rebase` met "cannot pull with rebase: You have unstaged
          # changes". Gevolg: zeven dagen lang geen enkele push, terwijl de runs
          # zelf gewoon leken te draaien.
          git add news-sitemap.xml sitemap.xml index.html
          git diff --staged --quiet || git commit -m "sitemap verversen [skip ci]"
          # Autostash zodat een onverwacht extra uitvoerbestand de rebase niet
          # opnieuw kan blokkeren.
          git pull --rebase --autostash origin main
          git push
